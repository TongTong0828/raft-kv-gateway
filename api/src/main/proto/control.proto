syntax = "proto3";
package kvgateway.v1;
option java_package = "dev.kvgateway.api";
option java_multiple_files = true;
import "google/protobuf/empty.proto";

message Entry { string key = 1; bytes value = 2; uint64 mod_revision = 3; }
message ServiceSpec {
  string service_id = 1; string path_prefix = 2; repeated string endpoints = 3;
  optional uint32 request_timeout_ms = 4;
  optional uint32 max_inflight = 5;
  optional uint32 max_connections_per_endpoint = 6;
}
message ConfigSnapshot { string group_id = 1; uint64 revision = 2; repeated ServiceSpec services = 3; }
message GetRequest { string key = 1; }
message GetResponse { Entry entry = 1; uint64 state_revision = 2; }
message PutRequest { string key = 1; bytes value = 2; uint64 expected_revision = 3; }
message DeleteRequest { string key = 1; uint64 expected_revision = 2; }
message MutationResponse { Entry entry = 1; uint64 revision = 2; }
message StatusResponse {
  string node_id = 1; string role = 2; string leader_id = 3; string leader_target = 4;
  uint64 applied_index = 5; uint64 snapshot_index = 6; uint64 snapshot_installs = 7;
  uint64 state_revision = 8; string group_id = 9; uint64 applied_term = 10; int64 log_start_index = 11;
}
message Command { oneof operation { GetRequest get = 1; PutRequest put = 2; DeleteRequest delete = 3; bool get_config = 4; } }
message CommandResult {
  enum Code { OK = 0; NOT_FOUND = 1; CONFLICT = 2; INVALID = 3; CAPACITY = 4; }
  Code code = 1; string message = 2; Entry entry = 3; uint64 state_revision = 4;
  ConfigSnapshot config = 5; uint64 current_revision = 6;
}
message StoreSnapshot { uint32 format_version = 1; int64 last_term = 2; int64 last_index = 3; uint64 state_revision = 4; repeated Entry entries = 5; }
service Control {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (MutationResponse);
  rpc Delete(DeleteRequest) returns (MutationResponse);
  rpc GetConfig(google.protobuf.Empty) returns (ConfigSnapshot);
  rpc WatchConfig(google.protobuf.Empty) returns (stream ConfigSnapshot);
  rpc GetStatus(google.protobuf.Empty) returns (StatusResponse);
}
