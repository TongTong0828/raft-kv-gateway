apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base, storage.yaml]
patches:
  - target: {kind: StatefulSet, name: cp}
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: kv-gp3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            minDomains: 3
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector: {matchLabels: {app: control}}
  - target: {kind: Service, name: gateway}
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
