apiVersion: v1
kind: Service
metadata: {name: control}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: control}
  ports:
    - {name: grpc, port: 50051}
    - {name: raft, port: 6000}
    - {name: admin, port: 9101}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: cp}
spec:
  serviceName: control
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: control}}
  template:
    metadata: {labels: {app: control}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: control}}
      containers:
        - name: control
          image: raft-kv-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["-jar", "/app/control-plane.jar"]
          envFrom: [{configMapRef: {name: kv-config}}]
          env:
            - name: KV_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: KV_DATA_DIR, value: /data}
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx128m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=32m -XX:ActiveProcessorCount=2 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
          ports: [{name: grpc, containerPort: 50051}, {name: raft, containerPort: 6000}, {name: admin, containerPort: 9101}]
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: '1', memory: 320Mi}}
          startupProbe: {httpGet: {path: /live, port: admin}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /ready, port: admin}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: admin}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /data}, {name: config, mountPath: /config, readOnly: true}]
      volumes: [{name: config, configMap: {name: kv-config}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: control}
spec: {minAvailable: 2, selector: {matchLabels: {app: control}}}
