apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: gateway
          image: raft-kv-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["-jar", "/app/gateway.jar"]
          env:
            - name: KV_CONTROL_SEEDS
              valueFrom: {configMapKeyRef: {name: kv-config, key: KV_CONTROL_SEEDS}}
            - {name: JAVA_TOOL_OPTIONS, value: '-Xmx256m -XX:MaxDirectMemorySize=128m -XX:ReservedCodeCacheSize=32m -XX:ActiveProcessorCount=2 -Dorg.slf4j.simpleLogger.defaultLogLevel=warn'}
          ports: [{name: http, containerPort: 8080}, {name: admin, containerPort: 9090}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: '2', memory: 768Mi}}
          startupProbe: {httpGet: {path: /live, port: admin}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /ready, port: admin}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: admin}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
