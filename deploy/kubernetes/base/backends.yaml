apiVersion: apps/v1
kind: Deployment
metadata: {name: backend-a}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend-a}}
  template:
    metadata: {labels: {app: backend-a}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: backend
          image: raft-kv-gateway:local
          imagePullPolicy: IfNotPresent
          args: ["-jar", "/app/demo-backend.jar"]
          env:
            - {name: KV_BACKEND_ID, value: backend-a}
            - {name: JAVA_TOOL_OPTIONS, value: '-Xmx32m -XX:MaxDirectMemorySize=16m -XX:ReservedCodeCacheSize=16m -XX:ActiveProcessorCount=1'}
          ports: [{name: http, containerPort: 8081}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: backend-a}
spec:
  selector: {app: backend-a}
  ports: [{name: http, port: 8081}]
---
